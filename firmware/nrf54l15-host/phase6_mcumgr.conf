# Phase 6 MCUboot/MCUmgr serial update profile. This fragment is selected
# explicitly with EXTRA_CONF_FILE and is not part of the normal host profile.
CONFIG_BOOTLOADER_MCUBOOT=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y

CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_BASE64=y
CONFIG_MCUMGR=y
CONFIG_UART_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UART=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_REBOOT=y

# Image upload and management handlers execute on the system work queue.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2304
