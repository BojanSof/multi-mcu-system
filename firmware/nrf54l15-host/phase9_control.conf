# Append after phase6_mcumgr.conf. Four retained records plus CBOR overhead fit
# in one SMP response even at the maximum node service payload size.
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=1024
CONFIG_MCUMGR_SMP_CBOR_MAX_ENCODING_LEVELS=2
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=3072
CONFIG_ENTROPY_GENERATOR=y

# Keep VCOM exclusive to SMP. The UART polling logger can otherwise interleave
# individual characters with a binary management response. Read logs using RTT.
CONFIG_LOG_BACKEND_UART=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n
CONFIG_PRINTK=n
