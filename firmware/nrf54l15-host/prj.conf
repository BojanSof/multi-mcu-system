# Phase 1 board bring-up: independent console logging and onboard GPIO only.
CONFIG_GPIO=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_CONSOLE=y
CONFIG_SERIAL=y

# Keep the bring-up thread simple and make stack usage visible during testing.
CONFIG_MAIN_STACK_SIZE=1536
CONFIG_THREAD_NAME=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
