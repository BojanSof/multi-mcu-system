name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.lock

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --yes ninja-build

      - name: Create isolated Python environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install --requirement tools/requirements.lock

      - name: Run native and Python regression suite
        run: scripts/test/run_native.sh

      - name: Check repository whitespace
        run: git diff --check

      - name: Check HIL matrix safe no-op
        run: .venv/bin/python tests/hil/acceptance_matrix.py

  embedded:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, multi-mcu-lab]
    timeout-minutes: 60
    steps:
      - name: Check out source and pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Audit preinstalled SDKs and toolchains
        run: |
          source ./.env.local
          .venv/bin/python scripts/doctor.py

      - name: Build all STM32 profiles
        env:
          BOOTLOADER_PUBLIC_KEY_HEADER: ${{ vars.BOOTLOADER_PUBLIC_KEY_HEADER }}
        run: |
          source ./.env.local
          scripts/build/build_stm32.sh

      - name: Build Nordic default profile
        run: |
          source ./.env.local
          scripts/build/build_nordic.sh --profile default

      - name: Build Nordic operator control profile
        run: |
          source ./.env.local
          scripts/build/build_nordic.sh --profile phase9

      - name: Build Nordic streamed STM update profile
        run: |
          source ./.env.local
          scripts/build/build_nordic.sh --profile phase10

      - name: Build Nordic factory-ROM recovery profile
        run: |
          source ./.env.local
          scripts/build/build_nordic.sh --profile phase11

      - name: Build final metrics baseline and optimized profiles
        run: |
          source ./.env.local
          scripts/build/build_nordic.sh --profile phase12-verbose
          scripts/build/build_nordic.sh --profile phase12
          .venv/bin/python tools/firmware/resource_report.py \
            --elf verbose=build/nrf54l15-host-phase12-verbose/nrf54l15-host/zephyr/zephyr.elf \
            --elf optimized=build/nrf54l15-host-phase12/nrf54l15-host/zephyr/zephyr.elf \
            --size-tool arm-none-eabi-size --output build/final-resources.json

      - name: Save static resource evidence
        uses: actions/upload-artifact@v4
        with:
          name: static-firmware-resources
          path: build/final-resources.json
